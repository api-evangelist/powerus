name: Powerus
description: >-
  PowerUs is Germany's largest job platform for skilled trades and crafts,
  connecting tradespeople (electricians, plumbers, roofers, metalworkers,
  mechanics and more) with employers across construction, electrical and
  mechanical industries. The platform offers automated job matching based on
  location, salary and working conditions, one-click applications without cover
  letters, direct employer-to-worker discovery, and native iOS and Android apps.
  PowerUs reports 250,000+ registered skilled workers and 6,000+ open positions.
  It is a consumer/employer marketplace product and does not currently expose a
  public developer API, developer portal, or OpenAPI-described API surface; its
  api.powerus.de and docs.powerus.de hosts are private/internal (docs gated
  behind Cloudflare Access). Backed by General Catalyst and HV Capital.
